<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Just for You 💛</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffdbe7, #d3eaff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #ff6b9c;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin-top: 20px;
            line-height: 1.4;
        }
        .btn {
            padding: 12px 25px;
            margin-top: 20px;
            background-color: #ff6b9c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff85ad;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1> Special For You😊</h1>
        <p>    </p>

        <button class="btn" onclick="document.getElementById('quote').classList.toggle('hidden')">
            Click to Reveal 💛
        </button>

        <p id="quote" class="hidden">
            “You don't realize it, but you make life a little better for people around you.” ✨
        </p>

        <p style="margin-top: 30px; font-size: 14px; opacity:0.7;">
            
        </p>
    </div>
</body>
</html>
